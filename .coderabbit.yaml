# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!bun.lock"
    - "!public/assets/**"
    - "!.scratch/**"
  path_instructions:
    - path: "**/*.{ts,tsx}"
      instructions: >
        This is Next.js 16 (App Router) with React 19 and Tailwind 4. Its APIs differ from older
        versions; do not flag newer conventions (e.g. instrumentation-client.ts) as mistakes.
        Formatting and linting are handled by oxfmt and oxlint, so skip style nits.
knowledge_base:
  code_guidelines:
    filePatterns:
      - AGENTS.md
